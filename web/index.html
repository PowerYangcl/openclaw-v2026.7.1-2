<!doctype html>
<html lang="zh-CN" data-openclaw-control-ui-base-path="/" data-openclaw-terminal-enabled="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Control UI</title>
    <meta name="description" content="OpenClaw Web Control UI — Vue 3 + Element Plus + Tailwind 4." />
    <!-- Inline favicon: 32x32 SVG with the OpenClaw glyph (matches the legacy UI iconography). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M9 8h6.5a4.5 4.5 0 0 1 0 9H9V8zm0 9h7.5a4.5 4.5 0 0 1 0 9H9v-9z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // Mirror the gateway-injected attributes onto window before Vue mounts, so the SPA can
      // resolve API base paths and detect terminal-enabled without FOUC. The Gateway rewrites
      // these two attributes at serve time via `serveResolvedIndexHtml` in
      // src/gateway/control-ui.ts (lines 799-811).
      (function () {
        try {
          var html = document.documentElement;
          var basePath = html.getAttribute("data-openclaw-control-ui-base-path");
          var terminalEnabled = html.getAttribute("data-openclaw-terminal-enabled");
          if (basePath != null) {
            window.__OPENCLAW_BASE_PATH__ = basePath;
          }
          if (terminalEnabled != null) {
            window.__OPENCLAW_TERMINAL_ENABLED__ = terminalEnabled === "true";
          }
        } catch (_) {
          /* SSR / unusual env — fall through; API client re-derives from window.location. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
